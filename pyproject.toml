[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=61" ]

[project]
name = "image-augmentation-benchmark"
version = "2.0.0"
description = "Reproducible RGB JPEG-to-GPU augmentation benchmark"
readme = "README.md"
keywords = [
  "benchmark",
  "computer vision",
  "image augmentation",
  "pytorch",
  "data loading",
  "gpu",
  "rgb",
]
license = "MIT"
maintainers = [ { name = "Vladimir Iglovikov" } ]
authors = [ { name = "Vladimir Iglovikov" } ]
requires-python = ">=3.13"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.4,<3",
  "pydantic>=2.13,<3",
  "pyyaml>=6,<7",
]
urls.Source = "https://github.com/albumentations-team/benchmark"
scripts.augbench = "augbench.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "opencv-python-headless>=4.13,<6",
  "pillow>=12,<13",
  "pre-commit>=4.6.2",
  "pytest>=9,<10",
  "pytest-randomly>=4,<5",
  "pytest-sugar>=1.1,<2",
  "pytest-timeout>=2.4,<3",
  "ruff>=0.12,<1",
  "types-pyyaml>=6,<7",
]

[tool.setuptools]
include-package-data = false
packages.find.where = [ "src" ]
packages.find.include = [ "augbench*" ]
packages.find.exclude = [ ".venv*", "tests*" ]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
target-version = "py313"
line-length = 120
indent-width = 4
# Assume Python 3.13
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".venv_*",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site",
  "site-packages",
  "venv",
]
format.indent-style = "space"
# Like Black, respect magic trailing commas.
format.quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
format.line-ending = "auto"
format.skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
lint.select = [ "ALL" ]
lint.ignore = [
  "ANN001",
  "ANN201",
  "ANN204",
  "ANN401",
  "ARG004",
  "BLE001",
  "C901",
  "COM812",  # Conflicts with the Ruff formatter.
  "CPY001",  # The repository-level MIT LICENSE applies; per-file headers are not used.
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D107",
  "D415",
  "EM101",
  "EM102",
  "FBT001",
  "FBT002",
  "FBT003",
  "G004",
  "N802",
  "N812",
  "PLC0415", # Allow imports inside functions for optional dependencies
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR2004",
  "TRY003",
]
# Allow fix for all enabled rules (when `--fix`) is provided.
lint.explicit-preview-rules = true
lint.per-file-ignores."src/augbench/cli.py" = [ "T201" ]  # CLI reports progress and machine-readable JSON.
lint.per-file-ignores."src/augbench/implementations/pillow_impl.py" = [
  "NPY002", # np.random is used only to sample augmentation parameters
  "S311",   # random is fine for augmentation — not cryptographic
]
lint.per-file-ignores."tests/**/*.py" = [
  "S101",   # allow assert in tests
  "SLF001", # allow private member access in tests
]
lint.fixable = [ "ALL" ]
lint.unfixable = []
# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
# Like Black, use double quotes for strings.
lint.pydocstyle.convention = "google"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
# for strict mypy: (this is the tricky one :-))
disallow_untyped_defs = true

[tool.pyright]
pythonVersion = "3.13"
# Prefer resolving imports from the repo venv when present (venvPath differs per machine).
venvPath = "."
venv = ".venv"
executionEnvironments = [ { root = ".", pythonVersion = "3.13" } ]
include = [ "src/augbench" ]
# Exclude common directories and virtual envs
exclude = [ "**/node_modules", "**/__pycache__", ".git", ".venv" ]
# Disable the missing imports report
reportMissingImports = false
reportMissingModuleSource = false

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "-v --tb=short -p randomly"
ini_options.timeout = 30
ini_options.pythonpath = [ "src" ]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
