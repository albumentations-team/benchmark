version: 1
selection:
  scenario: video-16f
  mode: pipeline
  media: video
  libraries: [dali, dali_experimental, pytorchvideo]
  transforms:
    - HorizontalFlip
    - Resize
    - RandomCrop224+HorizontalFlip+Normalize+ToTensor
    - RandomCrop224+Resize+Normalize+ToTensor
    - PyTorchVideoCanonical+Normalize+ToTensor
data:
  data_dir: /tmp/unused
  gcs_uri: gs://imagenet_validation/ucf101/ucf101.tar
  num_items: 32
  clip_length: 16
output:
  output_dir: gcp_runs/g2-standard-16-video-dataloader-ecosystem-smoke
  gcs_results_uri: gs://imagenet_validation/augmentation-results
execution:
  pipeline_scope: decode_dataloader_augment
  num_runs: 1
  batch_size: 8
  workers: 2
  min_time: 0
  thread_policy: pipeline-default
  device: cuda
cloud:
  provider: gcp
  project: albumentations
  zone: us-central1-a
  machine_type: g2-standard-16
  disk_size_gb: 100
