version: 1
selection:
  scenario: image-9ch
  mode: micro
  libraries: [torchvision, kornia]
  transform_set: paper
data:
  data_dir: /tmp/unused
  gcs_uri: gs://example-bucket/datasets/imagenet/val.tar
  num_items: 1000
  num_channels: 9
output:
  output_dir: gcp_runs/prod-g2-standard-16-9ch-micro-gpu
  gcs_results_uri: gs://example-bucket/benchmark-runs
execution:
  num_runs: 1
  device: cuda
cloud:
  provider: gcp
  project: example-project
  zone: us-central1-a
  machine_type: g2-standard-16
  disk_size_gb: 200
