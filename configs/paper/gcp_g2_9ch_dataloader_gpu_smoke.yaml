version: 1
selection:
  scenario: image-9ch
  mode: pipeline
  libraries: [torchvision, kornia]
  transform_set: paper
data:
  data_dir: /tmp/unused
  gcs_uri: gs://imagenet_validation/imagenet/val.tar
  num_items: 100
  num_channels: 9
output:
  output_dir: gcp_runs/g2-standard-16-9ch-dataloader-gpu-smoke
  gcs_results_uri: gs://imagenet_validation/augmentation-results
execution:
  pipeline_scope: decode_dataloader_augment
  num_runs: 1
  batch_size: 32
  workers: 2
  min_time: 0
  device: cuda
cloud:
  provider: gcp
  project: albumentations
  zone: us-central1-b
  machine_type: g2-standard-16
  disk_size_gb: 200
