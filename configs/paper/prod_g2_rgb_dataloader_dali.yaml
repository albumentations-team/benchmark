version: 1
selection:
  scenario: image-rgb
  mode: pipeline
  libraries: [dali]
  transform_set: paper
data:
  data_dir: /tmp/unused
  gcs_uri: gs://example-bucket/datasets/imagenet/val.tar
  num_items: 10000
output:
  output_dir: gcp_runs/prod-g2-standard-16-rgb-dataloader-dali
  gcs_results_uri: gs://example-bucket/benchmark-runs
execution:
  num_runs: 1
  batch_size: 256
  workers: 8
  pipeline_scope: decode_dataloader_augment
  device: cuda
  thread_policy: pipeline-default
cloud:
  provider: gcp
  project: example-project
  zone: us-central1-b
  machine_type: g2-standard-16
  disk_size_gb: 200
