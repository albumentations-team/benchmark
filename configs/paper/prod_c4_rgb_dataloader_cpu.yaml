version: 1
selection:
  scenario: image-rgb
  mode: pipeline
  libraries: [albumentationsx, torchvision, kornia, pillow]
  transform_set: paper
data:
  data_dir: /tmp/unused
  gcs_uri: gs://imagenet_validation/imagenet/val.tar
  num_items: 10000
output:
  output_dir: gcp_runs/prod-c4-standard-16-rgb-dataloader-cpu
  gcs_results_uri: gs://imagenet_validation/augmentation-results
execution:
  pipeline_scope: memory_dataloader_augment
  num_runs: 1
  batch_size: 256
  workers: 8
  min_time: 0
  thread_policy: pipeline-default
  device: none
cloud:
  provider: gcp
  project: albumentations
  zone: us-central1-a
  machine_type: c4-standard-16
  disk_size_gb: 100
