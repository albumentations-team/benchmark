version: 1
selection:
  scenario: image-rgb
  mode: micro
  libraries: [albumentationsx, torchvision, kornia, pillow]
  transform_set: paper
data:
  data_dir: /tmp/unused
  gcs_uri: gs://example-bucket/datasets/imagenet/val.tar
  num_items: 1000
output:
  output_dir: gcp_runs/c4-standard-16-rgb-micro-small
  gcs_results_uri: gs://example-bucket/benchmark-runs
execution:
  num_runs: 1
cloud:
  provider: gcp
  project: example-project
  zone: us-central1-b
  machine_type: c4-standard-16
  disk_size_gb: 200
