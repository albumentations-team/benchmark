version: 1
selection:
  scenario: image-rgb
  mode: pipeline
  libraries: [dali]
  transform_set: paper
data:
  data_dir: /tmp/unused
  gcs_uri: gs://imagenet_validation/imagenet/val.tar
  num_items: 100
output:
  output_dir: gcp_runs/g2-standard-16-rgb-dataloader-dali-smoke
  gcs_results_uri: gs://imagenet_validation/augmentation-results
execution:
  num_runs: 1
  batch_size: 32
  workers: 2
  pipeline_scope: decode_dataloader_augment
  device: cuda
  thread_policy: pipeline-default
cloud:
  provider: gcp
  project: albumentations
  zone: us-central1-b
  machine_type: g2-standard-16
  disk_size_gb: 200
