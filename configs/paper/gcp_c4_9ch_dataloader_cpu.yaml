version: 1
selection:
  scenario: image-9ch
  mode: pipeline
  libraries: [albumentationsx, torchvision, kornia]
  transform_set: paper
data:
  data_dir: /tmp/unused
  gcs_uri: gs://example-bucket/datasets/imagenet/val.tar
  num_items: 10000
  num_channels: 9
output:
  output_dir: gcp_runs/c4-standard-16-9ch-dataloader-memory-small
  gcs_results_uri: gs://example-bucket/benchmark-runs
execution:
  pipeline_scope: memory_dataloader_augment
  num_runs: 1
  batch_size: 256
  workers: 8
  min_time: 0
  thread_policy: pipeline-single-worker
  device: none
cloud:
  provider: gcp
  project: example-project
  zone: us-central1-b
  machine_type: c4-standard-16
  disk_size_gb: 200
