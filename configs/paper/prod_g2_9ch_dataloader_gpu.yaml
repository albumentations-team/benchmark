version: 1
selection:
  scenario: image-9ch
  mode: pipeline
  libraries: [torchvision, kornia]
  transform_set: paper
data:
  data_dir: /tmp/unused
  gcs_uri: gs://example-bucket/datasets/imagenet/val.tar
  num_items: 10000
  num_channels: 9
output:
  output_dir: gcp_runs/prod-g2-standard-16-9ch-dataloader-gpu
  gcs_results_uri: gs://example-bucket/benchmark-runs
execution:
  pipeline_scope: decode_dataloader_augment
  num_runs: 1
  batch_size: 128
  workers: 8
  min_time: 0
  thread_policy: pipeline-default
  device: cuda
cloud:
  provider: gcp
  project: example-project
  zone: us-central1-a
  machine_type: g2-standard-16
  disk_size_gb: 200
