version: 1
selection:
  scenario: video-16f
  mode: micro
  media: video
  libraries: [albumentationsx, torchvision, kornia]
  transform_set: paper
data:
  data_dir: /tmp/unused
  gcs_uri: gs://imagenet_validation/ucf101/ucf101.tar
  num_items: 2000
  clip_length: 16
output:
  output_dir: gcp_runs/prod-c4-standard-16-video-micro-cpu
  gcs_results_uri: gs://imagenet_validation/augmentation-results
execution:
  num_runs: 1
  device: none
cloud:
  provider: gcp
  project: albumentations
  zone: us-central1-a
  machine_type: c4-standard-16
  disk_size_gb: 100
